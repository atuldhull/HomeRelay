# The HomeRelay remote profile in a container. Nothing here is public by itself: ports publish on 127.0.0.1 only.
#   docker compose -f deploy/docker-compose.yml up -d --build                      remote profile on 127.0.0.1:3002
#   docker compose -f deploy/docker-compose.yml --profile tls-local up -d --build  + Caddy with a local CA on https://localhost:8443
# Configuration comes from deploy/remote.env (git-ignored; template: deploy/remote.env.example), never from the image.
services:
  homerelay-remote:
    image: homerelay-remote:local
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    init: true
    env_file: ${HOMERELAY_REMOTE_ENV:-remote.env}
    environment:
      DATABASE_PATH: /data/homerelay.db
      DOCUMENTS_DIR: /data/documents
      REMOTE_BIND: 0.0.0.0        # inside the container only; the host side below is loopback
    ports: ["127.0.0.1:3002:3002"]
    volumes: ["homerelay-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 15s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  # Local HTTPS rehearsal: a real TLS proxy with Caddy's internal CA. For a public deployment use Caddyfile.example instead.
  tls-local:
    profiles: ["tls-local"]
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on: { homerelay-remote: { condition: service_healthy } }
    ports: ["127.0.0.1:8443:443"]
    volumes: ["./Caddyfile.local:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]

volumes:
  homerelay-data: {}
  caddy-data: {}
